name: Verify

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://my-orbit-ci.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test scripts/test-admin-access.mjs
      - run: node --test scripts/test-title-tags.mjs scripts/test-project-card.mjs scripts/test-profile-header.mjs scripts/test-profile-themes.mjs scripts/test-nfc-routing.mjs src/modules/public-profile/vcard.test.mjs
      - run: node scripts/test-builder-draft.mjs
      - run: node scripts/test-builder-rate-limit.mjs
      - run: node scripts/test-workshop-code.mjs
      - run: node scripts/test-resume-analysis.mjs
      - run: node --test scripts/test-database.mjs
      - run: npm run build -- --webpack
      - name: Check client bundle for server credentials
        run: |
          if grep -rqlE 'SUPABASE_SERVICE_ROLE_KEY|LLM_API_KEY|OPENAI_API_KEY|sb_secret_[A-Za-z0-9_-]{15,}|sk-proj-[A-Za-z0-9_-]{15,}' .next/static; then
            echo 'Server credential marker found in client bundle.'
            exit 1
          fi
